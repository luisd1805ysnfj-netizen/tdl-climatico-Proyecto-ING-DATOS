name: captura

# Captura diaria programada de Open-Meteo -> data/bronce, y refresco de plata/oro.
# 14:00 UTC = 08:00 hora de Colima. GitHub puede retrasar unos minutos las tareas programadas.
on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch:       # botón "Run workflow" para probarla a mano

permissions:
  contents: write          # necesario para guardar los datos nuevos en el repo

concurrency:
  group: captura
  cancel-in-progress: false

jobs:
  capturar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Capturar Open-Meteo (reintentos + bitácora)
        id: captura
        continue-on-error: true      # si falla, igual se guarda la bitácora del fallo
        run: python -m extractors.captura_diaria

      - name: Actualizar plata y oro
        if: steps.captura.outcome == 'success'
        run: python -m pipeline.run_pipeline

      - name: Construir dataset curado E3
        if: steps.captura.outcome == 'success'
        run: python scripts/curate_e3.py

      - name: Guardar datos y bitácora en el repositorio
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data calidad/bitacora_captura.csv
          if git diff --cached --quiet; then
            echo "Sin cambios que guardar."
          else
            git commit -m "captura automática $(date -u +%Y-%m-%d)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi

      - name: Marcar la corrida como fallida si la captura falló
        if: steps.captura.outcome == 'failure'
        run: |
          echo "La captura falló; revisen calidad/bitacora_captura.csv"
          exit 1
